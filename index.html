<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML CSS izpit</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header__logo">
                <img src="assets/logo.png" alt="">
            </div>
            <nav class="header__nav">
                <ul class="header__nav-list">
                    <li class="header__nav-list-item">about</li>
                    <li class="header__nav-list-item">experience</li>
                    <li class="header__nav-list-item">skill</li>
                    <li class="header__nav-list-item">portfolio</li>
                    <li class="header__nav-list-item">contact</li>
                </ul>
            </nav>
        </header>
        <main class="main">
            <div class="main__banner">
                <div class="main__banner--left"></div>
                <div class="main__banner--right">
                    <p class="main__banner--text">
                        John <span class="secondary__text--color">Smith</span>
                    </p>
                    <h2 class="main__banner--title">I design and build things on the internet.</h2>
                </div>
            </div>
            <div class="main__banner--image">
                <img src="assets/hero-arrow.svg" alt="">
            </div>
        </main>
        <main class="main__contact">
            <div class="main__contact--banner">
                <h3 class="main__contact--title">Contact</h3>
                <p class="main__contact--text">I am currently seeking employment, so if you have a job or<br> project offer, or if you need more information, please do<br> not hesitate to contact me.</p>
                <button class="btn">Write Message</button>
                <div class="main__contact--social">
                    <img class="main__contact--social--image" src="assets/github-icon.svg" alt="">
                    <img class="main__contact--social--image" src="assets/linkedin-icon.svg" alt="">
                    <img class="main__contact--social--image" src="assets/instagram-icon.svg" alt="">
                    <img class="main__contact--social--image" src="assets/twitter-icon.svg" alt="">
                </div>
            </div>
        </main>
        <footer class="footer">
            <p class="footer__text">
                John <span class="secondary__text--color">Smith</span> - 2023
            </p>
        </footer>
    </div>
</body>
</html>
